name: Déploiement LWS

# Un seul chemin de déploiement, deux cibles, UNE BRANCHE PAR CIBLE (09/09/2026).
#
#   preprod    → preprod.adbjip.fr, sous-domaine indépendant. PHP y tourne,
#                donc les formulaires sont réellement testables. Déployé
#                automatiquement à chaque push sur la branche `preprod` : toute
#                branche de travail y est fusionnée, et c'est ce que le client
#                regarde.
#   production → www.adbjip.fr. Déployé à chaque push sur `main`, MAIS SEULEMENT
#                si la variable de dépôt PRODUCTION_ACTIVE vaut « true » — tant
#                que la bascule n'est pas décidée, ce dossier héberge le Symfony
#                encore en ligne, et un envoi l'écraserait. Sans la variable, le
#                run se termine sans rien envoyer, en le disant.
#
# La production utilise SES PROPRES identifiants (LWS_FTP_USER_PRODUCTION,
# LWS_FTP_PASSWORD_PRODUCTION, à créer le jour de la bascule) : le compte de
# préversion est enfermé dans son dossier, et un déploiement « production » qui
# l'emploierait par erreur écraserait… la préversion. Des secrets absents font
# échouer l'envoi, ils n'envoient rien au mauvais endroit.
#
# Avant le 09/09/2026, le déploiement écoutait la branche de refonte du moment,
# et la synchronisation nocturne — qui tourne toujours depuis la branche par
# défaut du dépôt — redéployait l'ANCIEN site de `main` sur la préversion chaque
# matin où le portefeuille bougeait. La branche par défaut doit donc être
# `preprod` (Settings → Branches) tant que `main` n'a pas reçu la refonte.
#
# Le compte FTP utilisé ici est volontairement **enfermé dans le dossier de la
# préversion** (champ « Répertoire » à la création du compte LWS :
# preprod.adbjip.fr — sans htdocs/, que LWS refuse : c'est déjà la racine où
# arrive tout compte FTP). Le chemin de dépôt est donc simplement « ./ » : même
# en cas d'erreur de configuration, ce compte ne peut atteindre ni la production
# ni l'ancien Symfony. C'est la garantie qui vaut mieux qu'une consigne.
#
# La production recevra ses propres identifiants le jour de la bascule, ce qui
# rend le geste explicite plutôt qu'automatique.
#
# Arborescence relevée le 14/08/2026 : le gestionnaire de fichiers montre home/,
# htdocs/ et tmp/, mais un compte FTP atterrit directement dans htdocs/. C'est là
# que vivent le site publié, l'ancien Symfony (JIPV3/, 1,72 Go), son dossier
# vendor/ et le fichier de vérification Search Console.
#
# Le compte de production se créera donc sans rien dans le champ « Répertoire ».
#
# Réglable en variables de dépôt si l'arborescence change
# (Settings → Secrets and variables → Actions → Variables) :
#   LWS_DIR_PREPROD     défaut ./
#   LWS_DIR_PRODUCTION  défaut ./

on:
  push:
    # `preprod` → préversion ; `main` → production (si PRODUCTION_ACTIVE).
    # Les branches de travail ne déploient rien : on les fusionne dans `preprod`.
    branches: [preprod, main]
  workflow_dispatch:
    inputs:
      cible:
        description: "Cible du déploiement"
        type: choice
        options: [preprod, production]
        default: preprod
  workflow_call:
    inputs:
      cible:
        type: string
        default: preprod

# La cible : celle demandée à la main ou par la synchronisation, sinon celle de
# la branche poussée. Le même calcul est répété dans `concurrency`, où le
# contexte `env` n'existe pas encore.
env:
  CIBLE: ${{ inputs.cible || (github.ref_name == 'main' && 'production' || 'preprod') }}

concurrency:
  group: deploiement-${{ inputs.cible || (github.ref_name == 'main' && 'production' || 'preprod') }}
  cancel-in-progress: false

jobs:
  # Le verrou de la production : un push sur `main` sans la variable ne fait rien.
  # Une étape qui l'explique, plutôt qu'un job ignoré en silence.
  verrou:
    runs-on: ubuntu-latest
    if: >-
      (inputs.cible || (github.ref_name == 'main' && 'production' || 'preprod')) == 'production'
      && vars.PRODUCTION_ACTIVE != 'true'
    steps:
      - run: |
          echo "::notice::Cible production, mais PRODUCTION_ACTIVE n'est pas « true » : rien n'est envoyé."
          echo "La production héberge encore l'ancien site. Poser la variable le jour de la bascule (REPRISE.md § 13)."

  deployer:
    runs-on: ubuntu-latest
    if: >-
      (inputs.cible || (github.ref_name == 'main' && 'production' || 'preprod')) != 'production'
      || vars.PRODUCTION_ACTIVE == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Les photos ne sont pas versionnées : sans cette étape, /biens s'afficherait
      # sans images. En cas d'échec de la source, le script conserve le jeu
      # précédent et sort en 0.
      - name: Récupérer les annonces et leurs photos
        run: node scripts/fetch-biens.mjs

      # Le sous-domaine comme le domaine principal servent le site à leur racine :
      # pas de chemin de base à appliquer, contrairement à GitHub Pages.
      - name: Construire
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run build

      # Une préversion ne doit pas entrer en concurrence avec le vrai site dans
      # les résultats de recherche. Chaque page prérendue porte déjà sa balise
      # robots (« index, follow », ou « noindex, follow » pour le 404) : on la
      # REMPLACE. La version précédente en insérait une seconde en tête de
      # <head>, et la préversion servait deux balises contradictoires — Google
      # retient la plus stricte, mais c'était faux. Le repli n'insère que si
      # une page n'en avait aucune.
      - name: Interdire l'indexation de la préversion
        if: env.CIBLE != 'production'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          rm -f dist/sitemap.xml
          find dist -name '*.html' -exec \
            sed -i 's|<meta name="robots" content="[^"]*">|<meta name="robots" content="noindex, nofollow">|' {} +
          grep -rL 'name="robots"' --include='*.html' dist | xargs -r \
            sed -i 's|<head>|<head><meta name="robots" content="noindex, nofollow">|'

      - name: Envoyer sur ${{ env.CIBLE }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LWS_FTP_HOST }}
          username: ${{ env.CIBLE == 'production' && secrets.LWS_FTP_USER_PRODUCTION || secrets.LWS_FTP_USER }}
          password: ${{ env.CIBLE == 'production' && secrets.LWS_FTP_PASSWORD_PRODUCTION || secrets.LWS_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: >-
            ${{ env.CIBLE == 'production'
                && (vars.LWS_DIR_PRODUCTION || './')
                || (vars.LWS_DIR_PREPROD || './') }}
          # leads.jsonl est écrit par contact.php sur le serveur : il contient
          # les demandes reçues et ne doit jamais être écrasé ni supprimé.
          # Sur la production, htdocs/ héberge encore l'ancien site : ces
          # dossiers ne doivent jamais être touchés par un envoi.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            leads.jsonl
            JIPV3/**
            vendor/**
            .quarantaine/**

      # AJOUTÉ le 27/08/2026 — LE GARDE-FOU DU PRÉRENDU.
      #
      # Rien d'existant n'est modifié : c'est une étape de plus, en fin de course.
      #
      # Pourquoi elle est devenue nécessaire : `prerender.mjs` sort en 0 même
      # quand il n'a rien produit (pas de Chrome sur le runner, par exemple). Le
      # déploiement continuait donc, et le site partait non indexable SANS AUCUNE
      # ALERTE. Depuis que le repli monopage a été retiré du `.htaccess` pour
      # renvoyer de vraies 404, l'enjeu a changé d'échelle : un prérendu vide ne
      # dégrade plus le site, il fait répondre 404 à TOUTES les routes.
      #
      # `verifier-deploiement.mjs` connaît les deux cibles : sur la préversion il
      # EXIGE `Disallow: /`, sur la production il exige l'inverse. Il sort en 1
      # dès qu'un des contrôles échoue, ce qui passe le run au rouge.
      #
      # SI CETTE ÉTAPE EST UN JOUR RETIRÉE, remettre les trois lignes du repli
      # monopage dans `public/.htaccess` : c'est écrit à l'endroit exact.
      - name: Vérifier la mise en ligne
        # L'URL est calculée ici et non dans `run` : une expression `${{ }}` sur
        # plusieurs lignes à l'intérieur d'un bloc `run: |` garderait ses retours
        # à la ligne, le bloc littéral ne les repliant pas. En `env`, le scalaire
        # replié `>-` s'en charge.
        env:
          CIBLE_URL: >-
            ${{ env.CIBLE == 'production'
                && (vars.URL_PRODUCTION || 'https://www.adbjip.fr')
                || (vars.URL_PREPROD || 'https://preprod.adbjip.fr') }}
        run: |
          # ON RÉESSAIE AU LIEU DE DEVINER UN DÉLAI.
          #
          # L'envoi FTP est terminé quand cette étape démarre, mais l'hébergeur
          # met quelques secondes à servir un fichier ou un DOSSIER tout juste
          # créé. Relevé le 27/08/2026 : un `sleep 20` fixe a suffi au run #17
          # et pas au #18, où /agence — un dossier créé par ce déploiement même —
          # répondait encore 404 vingt secondes après l'envoi, puis 200 deux
          # minutes plus tard. Un délai fixe transforme ce garde-fou en tirage au
          # sort, et un garde-fou qui crie au hasard finit par ne plus être lu.
          for essai in 1 2 3 4 5; do
            sleep 15
            if npm run verifier -- "$CIBLE_URL"; then
              exit 0
            fi
            echo "::warning::Vérification en échec à l'essai $essai — nouvelle tentative"
          done
          echo "::error::Les contrôles de mise en ligne échouent après 5 essais."
          exit 1

      - name: Rappel
        run: |
          echo "Déployé sur ${{ env.CIBLE }}."
          echo "Vérifier que .htaccess est bien présent à la racine :"
          echo "certains clients FTP ignorent les fichiers commençant par un point."
