    <!-- %BASE_URL% suit le chemin de base : la préversion n'est pas servie à la racine.
         Le SVG est prioritaire là où il est reconnu ; le .ico reste pour le reste. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    
    <!-- L'INTERRUPTEUR DE MOUVEMENT, posé avant la première peinture.
         `?mouvement=0` coupe tout le système d'animation, `?mouvement=1` le
         rétablit, et le choix tient pour la session — on navigue donc d'une page
         à l'autre sans réécrire le paramètre.

         Ici et pas dans le bundle : si l'attribut arrivait avec React, la page
         s'animerait le temps du chargement, ce qui est précisément ce qu'on
         cherche à supprimer. Voir `src/lib/mouvement.ts`. -->
    <script>
      (function () {
        try {
          var p = new URLSearchParams(location.search).get('mouvement');
          var m = p !== null ? p : sessionStorage.getItem('jip:mouvement');
          if (p !== null) sessionStorage.setItem('jip:mouvement', p);
          if (m === '0') document.documentElement.dataset.mouvement = '0';
        } catch (e) {
          // sessionStorage refusé : on retombe sur le seul paramètre d'URL.
          if (/[?&]mouvement=0/.test(location.search))
            document.documentElement.dataset.mouvement = '0';
        }
      })();
    </script>

    <!-- SANS JAVASCRIPT, RIEN N'EST MASQUÉ.
         Mesuré : le prérendu exécute React, qui pose `data-voile` sur les
         éléments sous le pli, et `[data-voile] { opacity: 0 }` s'applique alors
         au HTML STATIQUE. Résultat constaté à la capture, scripts désactivés :
         l'accueil n'affichait que son héros et trois plaques, tout le reste —
         les quatre métiers, le portefeuille, la présentation de l'agence —
         était dans le DOM mais invisible.

         Ce `<noscript>` ne coûte rien quand les scripts tournent (il est inerte)
         et rend tout visible quand ils ne tournent pas. Il ne peut pas produire
         de scintillement, contrairement à un retrait de l'attribut au prérendu :
         celui-ci ferait apparaître le contenu, puis React le masquerait à
         l'hydratation.

         L'observateur d'intersection reste le seul maître du masquage quand le
         JavaScript est là. -->
    <noscript>
      <style>
        [data-voile],
        [data-trait],
        [data-calage] {
          opacity: 1 !important;
          clip-path: none !important;
          transform: none !important;
        }
      </style>
    </noscript>

    <!-- QUATRE FAMILLES, ET CHACUNE A UN RÔLE — direction « La Plaque », 04/09/2026.
         Instrument Serif   les titres : un romain éditorial, en un seul poids.
         Figtree            le texte courant, les étiquettes, l'interface.
         IBM Plex Mono      les repères — numéros d'option, références d'annonce,
                            « MANDAT I » : ce qui se lit comme une cote de dossier.
         Archivo 600        les CHIFFRES qui comptent — prix, téléphone — un seul
                            poids, plus d'axe de largeur (il pesait 88 Ko à lui seul).

         La version précédente chargeait Archivo (wdth + wght) et Inter (opsz + wght)
         pour 159 Ko. Ici quatre familles, mais chacune réduite au strict nécessaire :
         Instrument Serif en deux styles, Figtree en trois poids, Plex Mono en deux,
         Archivo en un. Le poids total est à relever dans l'onglet réseau après le
         premier build — il n'est pas estimé ici.

         Le préchargement non bloquant est conservé : la page s'affiche avant les
         fontes. Les replis sont des @font-face AUX MÉTRIQUES AJUSTÉES (src/index.css,
         en tête) : Times, Arial et Arial Bold locales, redimensionnées aux boîtes
         d'Instrument Serif, Figtree et Archivo. Poids relevé le 04/09/2026, sous-
         ensemble latin : 122,3 Ko pour les huit fichiers (contre 159,3 avant).

         PRÉCHARGER LES WOFF2 A ÉTÉ ESSAYÉ SUR LA VERSION PRÉCÉDENTE ET MESURÉ PERDANT
         (CLS −71 % mais LCP +783 ms sur un lien bridé) : ne pas le refaire sans
         remesurer. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"></noscript>

    <!-- Open Graph — valeurs de repli, réécrites par `SEOHead` après le montage.
         Elles servent aux robots qui ne rendent pas le JavaScript et aux pages
         non prérendues. Le nom du site est celui de `SEO_CONFIG.site.name` :
         il portait « JIP Immobilier » ici et « JIP — Jobard Immobilier Paris »
         là, et un aperçu de partage montrait donc une raison sociale que le
         site n'emploie nulle part.

         `og:image` fait 1200 × 630 — vérifié sur le fichier. Déclarer les
         dimensions évite que l'aperçu se cadre en carré le temps du
         téléchargement. -->
    <meta property="og:title" content="JIP — Gérance locative et syndic de copropriété, Paris 8e" />
    <meta property="og:description" content="Gestion locative et syndic de copropriété à Paris 8e. Agence indépendante depuis 2011, 27 rue de Lisbonne." />

    <meta property="og:url" content="https://www.adbjip.fr/" />
    <meta property="og:image" content="https://www.adbjip.fr/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Façade haussmannienne parisienne, immeuble de rapport avec ses deux lanternes" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="JIP — Jobard Immobilier Paris" />

    <!-- LES DONNÉES STRUCTURÉES NE SONT PLUS ICI.
         Un `RealEstateAgent` statique vivait dans ce fichier. Deux raisons de
         l'avoir retiré, toutes deux vérifiées dans `dist/` :

            — le PREMIER du document — et l'écrasait dès le montage de React.
            Il n'a jamais été livré aux moteurs autrement que sur les pages

         2. C'était une seconde source de vérité, et elle avait déjà divergé :
            elle déclarait `serviceArea: City/Paris` quand `seo.ts` déclarait

         La source unique est `src/config/seo.ts`, qui dérive lui-même adresse,
