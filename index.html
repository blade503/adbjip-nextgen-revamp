    <!-- %BASE_URL% suit le chemin de base : la préversion n'est pas servie à la racine.
         Le SVG est prioritaire là où il est reconnu ; le .ico reste pour le reste. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    
    <!-- L'ÉCLAIRAGE DE L'OUVERTURE, POSÉ AVANT LA PREMIÈRE PEINTURE.
         Le prérendu écrit dix pages HTML statiques : s'il portait la classe
         d'heure, il figerait l'heure de la machine de BUILD. Constaté — le HTML
         sortait en « heure-midi », et un visiteur arrivant à 22 h voyait la
         façade en plein soleil le temps que React s'hydrate.

         La classe est donc posée sur <html> par ce script, en tête et de façon
         synchrone : elle est là avant le premier pixel, et React n'y touche
         jamais puisqu'elle n'est pas sur un élément qu'il rend.

         Les bornes suivront le lever et le coucher du soleil à Paris par une
         table de douze valeurs mensuelles ; les bornes fixes suffisent d'abord. -->
    <!-- L'INTERRUPTEUR DE MOUVEMENT, posé avant la première peinture.
         `?mouvement=0` coupe tout le système d'animation, `?mouvement=1` le
         rétablit, et le choix tient pour la session — on navigue donc d'une page
         à l'autre sans réécrire le paramètre.

         Ici et pas dans le bundle : si l'attribut arrivait avec React, la page
         s'animerait le temps du chargement, ce qui est précisément ce qu'on
         cherche à supprimer. Voir `src/lib/mouvement.ts`. -->
    <script>
      (function () {
        try {
          var p = new URLSearchParams(location.search).get('mouvement');
          var m = p !== null ? p : sessionStorage.getItem('jip:mouvement');
          if (p !== null) sessionStorage.setItem('jip:mouvement', p);
          if (m === '0') document.documentElement.dataset.mouvement = '0';
        } catch (e) {
          // sessionStorage refusé : on retombe sur le seul paramètre d'URL.
          if (/[?&]mouvement=0/.test(location.search))
            document.documentElement.dataset.mouvement = '0';
        }
      })();
    </script>

    <script>
      (function () {
        // Le prérendu exécute ce script lui aussi : le HTML statique part donc
        // avec la classe de l'heure de BUILD. On la retire avant de poser la
        // bonne, sinon les deux cohabitent et c'est l'ordre du CSS qui tranche,
        // pas l'ordre d'ajout.
        var r = document.documentElement;
        r.className = r.className.replace(/\bheure-\w+\b/g, '').trim();
        var h = new Date().getHours();
        var e = h >= 6 && h < 8 ? 'aube'
              : h >= 8 && h < 11 ? 'matin'
              : h >= 11 && h < 15 ? 'midi'
              : h >= 15 && h < 21 ? 'doree'
              : 'nuit';
        document.documentElement.classList.add('heure-' + e);
      })();
    </script>

    <!-- SANS JAVASCRIPT, RIEN N'EST MASQUÉ.
         Mesuré : le prérendu exécute React, qui pose `data-voile` sur les
         éléments sous le pli, et `[data-voile] { opacity: 0 }` s'applique alors
         au HTML STATIQUE. Résultat constaté à la capture, scripts désactivés :
         l'accueil n'affichait que son héros et trois plaques, tout le reste —
         les quatre métiers, le portefeuille, la présentation de l'agence —
         était dans le DOM mais invisible.

         Ce `<noscript>` ne coûte rien quand les scripts tournent (il est inerte)
         et rend tout visible quand ils ne tournent pas. Il ne peut pas produire
         de scintillement, contrairement à un retrait de l'attribut au prérendu :
         celui-ci ferait apparaître le contenu, puis React le masquerait à
         l'hydratation.

         L'observateur d'intersection reste le seul maître du masquage quand le
         JavaScript est là. -->
    <noscript>
      <style>
        [data-voile],
        [data-trait],
        [data-calage] {
          opacity: 1 !important;
          clip-path: none !important;
          transform: none !important;
        }
      </style>
    </noscript>

    <!-- Deux linéales, deux axes.
         Inter (opsz 14..32) pour le texte, la donnée et l'interface.
         Archivo pour les titres et les plaques : elle porte un axe de LARGEUR
         (wdth 100..125) qu'Inter n'a pas, et les capitales élargies sont la
         proportion d'une plaque de rue parisienne. Inter est le repli déclaré
         d'Archivo : pendant l'attente le texte est rendu dans une police déjà
         présente, jamais nu — seule la largeur se resserre à la substitution.

         COÛT, MESURÉ le 27/08/2026 sur le sous-ensemble latin :
             Archivo (wdth + wght) ....  88,0 Ko
             Inter   (opsz + wght) ....  71,3 Ko
             ------------------------------------
             total ....................  159,3 Ko
         contre 201,9 Ko auparavant pour Inter seule — parce que l'axe italique
         était demandé (133,7 Ko à lui seul) et qu'aucune ligne du site n'est en
         italique. Ajouter une seconde famille allège donc la page de 42,6 Ko.

         À savoir : borner les plages d'axes dans l'URL ne réduit PAS le fichier.
         Vérifié le 27/08/2026 — `wdth,wght@100..125,400..700`, `…,500..600` et
         `wdth@110..118,wght@500..550` renvoient les mêmes 90 096 octets exactement.
         Google Fonts ne découpe que par sous-ensemble de caractères, pas par
         plage d'axe. Retirer complètement `wdth` ferait tomber Archivo à
         34,1 Ko (mesuré), mais l'axe de largeur est tout l'argument typographique du
         projet : c'est lui qui sépare les titres du texte.

         Préchargement non bloquant : la page s'affiche avant les fontes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- PRÉCHARGER LES DEUX WOFF2 A ÉTÉ ESSAYÉ, ET MESURÉ PERDANT.

         Deux `<link rel="preload" as="font">` sur les fichiers latins d'Archivo
         et d'Inter suppriment bien le premier décalage. Relevé sur quatre
         chargements à froid, 390 × 844, réseau bridé à 1,6 Mb/s et 150 ms :

             CLS  0,001914  →  0,000555   (−71 %)
             LCP     1 657  →     2 440 ms  (+783)

         La chronologie explique tout : les deux polices (72 + 88 Ko) partent à
         308 ms, l'image du héros (78 Ko, `fetchPriority="high"`) à 309 ms. Sur
         un lien bridé elles se partagent la bande passante, et l'image — qui
         EST l'élément LCP, vérifié par PerformanceObserver — finit à 2 409 ms
         au lieu de ~1 600.

         On échangeait donc 0,00136 de CLS, sur un seuil de 0,1, contre 783 ms
         de LCP, sur un seuil de 2 500 où l'on passait à 72 ms près. Perte
         nette : non retenu.

         Le décalage résiduel (0,000555, la plaque de rue à 2 526 ms) ne se
         corrige pas par le réseau mais par une POLICE DE REPLI AUX MÉTRIQUES
         AJUSTÉES (`size-adjust`, `ascent-override`) : coût réseau nul. Non
         fait — c'est un changement de la pile de polices, pas un réglage. -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=Inter:opsz,wght@14..32,100..900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=Inter:opsz,wght@14..32,100..900&display=swap"></noscript>

    <!-- Open Graph — valeurs de repli, réécrites par `SEOHead` après le montage.
         Elles servent aux robots qui ne rendent pas le JavaScript et aux pages
         non prérendues. Le nom du site est celui de `SEO_CONFIG.site.name` :
         il portait « JIP Immobilier » ici et « JIP — Jobard Immobilier Paris »
         là, et un aperçu de partage montrait donc une raison sociale que le
         site n'emploie nulle part.

         `og:image` fait 1200 × 630 — vérifié sur le fichier. Déclarer les
         dimensions évite que l'aperçu se cadre en carré le temps du
         téléchargement. -->
    <meta property="og:title" content="JIP — Gérance locative et syndic de copropriété, Paris 8e" />
    <meta property="og:description" content="Gestion locative et syndic de copropriété à Paris 8e. Agence indépendante depuis 2011, 27 rue de Lisbonne." />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Façade haussmannienne parisienne, immeuble de rapport avec ses deux lanternes" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="JIP — Jobard Immobilier Paris" />

    <!-- LES DONNÉES STRUCTURÉES NE SONT PLUS ICI.
         Un `RealEstateAgent` statique vivait dans ce fichier. Deux raisons de
